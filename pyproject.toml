[project]
name = "trading-algo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "timesfm[torch]==3.0.0",
    "numpy>=1.26.4",
    "pandas>=2.0",
    "yfinance>=0.2.50",
    "statsmodels>=0.14",
    "requests>=2.31",
    "lxml>=5.0",
    "scipy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
